stage:
  name: acta_downstream_investigation
  version: "1.0"
  scientific_role: detailed_inspection_candidate_selection

inputs:
  geometric_near_duplicates: full_bri_nn
  entry_metadata: downstream_metadata

resolution_filter:
  enabled: true
  maximum_angstrom: 4.0
  operator: less_than_or_equal
  missing_resolution_policy: reject

  method_precedence:
    - electron_microscopy
    - diffraction

  electron_microscopy:
    experimental_method: ELECTRON MICROSCOPY
    source_field: em_3d_reconstruction_resolution
    aggregation: minimum_numeric
    multi_value_threshold_equivalence_audited: true

  diffraction:
    experimental_methods:
      - X-RAY DIFFRACTION
      - NEUTRON DIFFRACTION
      - FIBER DIFFRACTION
      - ELECTRON CRYSTALLOGRAPHY
    source_field: refine_ls_d_res_high
    aggregation: minimum_numeric

pandda_group_deposition_filter:
  enabled: true
  metadata_field: deposit_group_mentions_pandda
  reject_when: true

same_deposition_filter:
  enabled: true
  query_field: query_pdb_id
  subject_field: subject_pdb_id
  reject_when_equal: true

manual_review:
  automatic_virus_filtering: false
  automatic_ribosome_filtering: false

expected_preflight_counts:
  input_geometric_near_duplicate_pairs: 1072751
  after_resolution_filter: 618665
  after_pandda_group_deposition_filter: 618651
  after_same_deposition_filter: 122416
