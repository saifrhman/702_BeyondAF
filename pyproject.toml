[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdbclean"
version = "0.1.0"
description = "Reproducible PDB quality-cleaning and geometric-deduplication pipeline"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "gemmi>=0.7",
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=15",
    "scipy>=1.15",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[project.scripts]
pdbclean = "pdbclean.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"pdbclean.ui" = ["static/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
